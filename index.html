<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мойка ковров Актобе: заказать вывоз</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fffbea; --card:#ffffff; --ink:#1a1a1a; --muted:#5e5a4a; --line:#e6dfc0;
  --yellow:#ffc400; --yellow-ink:#1a1a1a; --err:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140c; --card:#201d11; --ink:#f6f1dc; --muted:#b8b196; --line:#3a3620;
    --err:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16140c; --card:#201d11; --ink:#f6f1dc; --muted:#b8b196; --line:#3a3620;
  --err:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:52px;height:52px;border-radius:50%;background:var(--yellow);color:#1a1a1a;
  display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:.5px;flex:none}
.brand b{display:block;font-size:17px}
.brand span{font-size:14px;color:var(--muted)}
.bt{min-width:0}
.lang{margin-left:auto;display:flex;flex:none;border:2px solid var(--yellow);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:14px;
  padding:8px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
h1{font-size:30px;line-height:1.15;margin:0 0 10px;letter-spacing:-.5px}
.lead{margin:0 0 18px;color:var(--muted);font-size:16px}
.perks{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:8px;font-size:15px}
.perks li{display:flex;gap:10px;align-items:flex-start}
.perks li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;
  background:var(--yellow);color:#1a1a1a;font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.card{background:var(--card);border:2px solid var(--yellow);border-radius:16px;padding:18px}
label{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
.opt{font-weight:400;color:var(--muted)}
.field{margin-bottom:14px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:10px;padding:12px 13px}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-color:var(--ink)}
.err{display:none;color:var(--err);font-size:14px;margin-top:5px}
.field.bad .err{display:block}
.field.bad input,.field.bad textarea{border-color:var(--err)}
button.send{width:100%;border:0;border-radius:12px;background:var(--yellow);color:var(--yellow-ink);
  font:inherit;font-weight:800;font-size:18px;padding:15px;cursor:pointer}
button.send:active{transform:scale(.99)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.done{display:none;margin-top:16px;padding:14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);font-size:15px}
.done.show{display:block}
.done a{color:var(--ink);font-weight:700}
.call{display:block;text-align:center;margin-top:18px;font-size:16px;color:var(--ink)}
.call b{white-space:nowrap}
.calc{margin:4px 0 16px;padding:14px;border-radius:12px;background:var(--bg);border:1.5px dashed var(--yellow)}
.calc h2{font-size:17px;margin:0 0 4px}
.calc p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row input{min-width:0;flex:1}
.x{color:var(--muted)}
.rm{flex:none;width:40px;height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font:inherit;cursor:pointer}
.add{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:6px 0;margin-bottom:8px}
.sum{font-size:16px;padding-top:10px;border-top:1.5px solid var(--line)}
.tot{display:inline-block;margin-top:4px;font-size:22px;font-weight:800}
.pcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.pcs label{font-size:14px}
.pcsnote{margin:0 0 6px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo" aria-hidden="true">MK</div>
    <div class="bt"><b data-i18n="brand"></b><span>@moika.kovrov_aktobe</span></div>
    <div class="lang" role="group" aria-label="Тіл / Язык">
      <button type="button" id="l-ru" aria-pressed="true">RU</button>
      <button type="button" id="l-kk" aria-pressed="false">ҚАЗ</button>
    </div>
  </div>

  <h1 data-i18n="h1"></h1>
  <p class="lead" data-i18n="lead"></p>

  <ul class="perks">
    <li data-i18n="p1"></li>
    <li data-i18n="p2"></li>
    <li data-i18n="p3"></li>
    <li data-i18n="p4"></li>
  </ul>

  <div class="card">
    <form id="f" novalidate>
      <div class="field" id="g-name">
        <label for="name" data-i18n="name_l"></label>
        <input id="name" autocomplete="name" data-i18n-ph="name_ph">
        <div class="err" data-i18n="name_e"></div>
      </div>
      <div class="field" id="g-phone">
        <label for="phone" data-i18n="phone_l"></label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="8 777 123 45 67">
        <div class="err" data-i18n="phone_e"></div>
      </div>
      <div class="field" id="g-addr">
        <label for="addr" data-i18n="addr_l"></label>
        <input id="addr" autocomplete="street-address" data-i18n-ph="addr_ph">
        <div class="err" data-i18n="addr_e"></div>
      </div>
      <div class="calc">
        <h2 data-i18n="calc_h"></h2>
        <p data-i18n="calc_p"></p>
        <div id="rows"></div>
        <button type="button" class="add" id="add" data-i18n="add"></button>
        <p class="pcsnote" data-i18n="pcsnote"></p>
        <div class="pcs">
          <div><label for="kurp" data-i18n="kurp_l"></label><input id="kurp" inputmode="numeric" placeholder="0"></div>
          <div><label for="blank" data-i18n="blank_l"></label><input id="blank" inputmode="numeric" placeholder="0"></div>
        </div>
        <div class="sum" id="sum" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="note"><span data-i18n="note_l"></span> <span class="opt" data-i18n="opt"></span></label>
        <textarea id="note" data-i18n-ph="note_ph"></textarea>
      </div>
      <button class="send" type="submit" data-i18n="send"></button>
      <p class="hint" data-i18n="hint"></p>
    </form>
    <div class="done" id="done">
      <span data-i18n="done1"></span> <a id="wa" href="#" target="_blank" rel="noopener"><span data-i18n="done2"></span></a> <span data-i18n="done3"></span>
    </div>
  </div>

  <a class="call" href="tel:+77474585867"><span data-i18n="call"></span> <b>8 747 458 58 67</b></a>
</main>

<script>
(function(){
  var WA = "77474585867";
  var T = {
    ru: {
      title:"Мойка ковров Актобе: заказать вывоз",
      brand:"Мойка ковров Актобе",
      h1:"Закажите стирку ковров с вывозом на дом",
      lead:"Оставьте адрес и телефон. Мы свяжемся с вами и согласуем время.",
      p1:"Цена: 600 тг за м². Если площадь больше 15 м², 700 тг за м²",
      p2:"Корпешки и одеяла: 2000 тг за штуку, любой размер",
      p3:"Вывоз и доставка бесплатно",
      p4:"Глубокая стирка: ковёр свежий и без запаха",
      name_l:"Ваше имя", name_ph:"Например, Айгуль", name_e:"Напишите, как к вам обращаться",
      phone_l:"Телефон", phone_e:"Укажите номер телефона, например 8 777 123 45 67",
      addr_l:"Адрес для вывоза", addr_ph:"Улица, дом, квартира", addr_e:"Укажите адрес, откуда забрать ковры",
      calc_h:"Рассчитайте стоимость",
      calc_p:"Введите размеры ковра в метрах. 600 тг за м², при площади больше 15 м² 700 тг за м².",
      w_ph:"Ширина, м", l_ph:"Длина, м", rm:"Убрать ковёр", add:"+ Добавить ещё ковёр",
      pcsnote:"Корпешки и одеяла: 2000 тг за штуку, любой размер.",
      kurp_l:"Корпешки, шт", blank_l:"Одеяла, шт",
      empty:"Введите размеры ковра или количество корпешек и одеял, и мы посчитаем стоимость.",
      s_carpets:"Ковры", s_kurp:"Корпешки", s_blank:"Одеяла", s_pcs:"шт", s_total:"Итого", s_tg:"тг",
      note_l:"Комментарий", opt:"(необязательно)", note_ph:"Например: есть пятна от чая, во вторник удобнее",
      send:"Отправить заявку",
      hint:"Откроется WhatsApp с готовым сообщением. Останется нажать «Отправить».",
      done1:"Если WhatsApp не открылся,", done2:"нажмите здесь", done3:"или позвоните нам.",
      call:"Или позвоните:"
    },
    kk: {
      title:"Ақтөбеде кілем жуу: тапсырыс беру",
      brand:"Ақтөбеде кілем жуу",
      h1:"Кілем жууға үйден алып кетумен тапсырыс беріңіз",
      lead:"Мекенжайыңыз бен телефон нөміріңізді қалдырыңыз. Біз сізбен хабарласып, уақытты келісеміз.",
      p1:"Бағасы: 1 м² үшін 600 тг. Ауданы 15 м²-ден асса, 1 м² үшін 700 тг",
      p2:"Көрпешелер мен көрпелер: данасы 2000 тг, кез келген өлшем",
      p3:"Алып кету және жеткізу тегін",
      p4:"Терең жуу: кілем таза әрі иіссіз",
      name_l:"Атыңыз", name_ph:"Мысалы, Айгүл", name_e:"Атыңызды жазыңыз",
      phone_l:"Телефон", phone_e:"Телефон нөміріңізді жазыңыз, мысалы 8 777 123 45 67",
      addr_l:"Алып кететін мекенжай", addr_ph:"Көше, үй, пәтер", addr_e:"Кілемдерді қайдан алу керек екенін жазыңыз",
      calc_h:"Құнын есептеңіз",
      calc_p:"Кілемнің өлшемін метрмен енгізіңіз. 1 м² үшін 600 тг, ауданы 15 м²-ден асса 700 тг.",
      w_ph:"Ені, м", l_ph:"Ұзындығы, м", rm:"Кілемді жою", add:"+ Тағы бір кілем қосу",
      pcsnote:"Көрпешелер мен көрпелер: данасы 2000 тг, кез келген өлшем.",
      kurp_l:"Көрпешелер, дана", blank_l:"Көрпелер, дана",
      empty:"Кілем өлшемін немесе көрпеше мен көрпе санын енгізіңіз, біз құнын есептейміз.",
      s_carpets:"Кілемдер", s_kurp:"Көрпешелер", s_blank:"Көрпелер", s_pcs:"дана", s_total:"Барлығы", s_tg:"тг",
      note_l:"Пікір", opt:"(міндетті емес)", note_ph:"Мысалы: шай дағы бар, сейсенбіде ыңғайлы",
      send:"Өтінім жіберу",
      hint:"WhatsApp дайын хабарламамен ашылады. «Жіберу» түймесін басу жеткілікті.",
      done1:"WhatsApp ашылмаса,", done2:"мына жерді басыңыз", done3:"немесе бізге қоңырау шалыңыз.",
      call:"Немесе қоңырау шалыңыз:"
    }
  };

  var lang = "ru";
  try {
    var saved = localStorage.getItem("lang");
    if (saved === "ru" || saved === "kk") lang = saved;
    else if ((navigator.language || "").toLowerCase().indexOf("kk") === 0) lang = "kk";
  } catch (e) {}

  var f = document.getElementById("f");
  var rowsEl = document.getElementById("rows");
  var summary = {area:0, price:600, k:0, b:0, total:0, items:[]};

  function val(id){ return document.getElementById(id).value.trim(); }
  function mark(g, bad){ document.getElementById(g).classList.toggle("bad", bad); return bad; }
  function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n > 0 ? n : 0; }
  function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0"); }
  function fmtA(n){ return (Math.round(n * 100) / 100).toString().replace(".", ","); }

  function apply(root){
    var t = T[lang], i, els;
    els = root.querySelectorAll("[data-i18n]");
    for (i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute("data-i18n")];
    els = root.querySelectorAll("[data-i18n-ph]");
    for (i = 0; i < els.length; i++) els[i].placeholder = t[els[i].getAttribute("data-i18n-ph")];
    els = root.querySelectorAll("[data-i18n-aria]");
    for (i = 0; i < els.length; i++) els[i].setAttribute("aria-label", t[els[i].getAttribute("data-i18n-aria")]);
  }

  function addRow(){
    var d = document.createElement("div"); d.className = "row";
    d.innerHTML = '<input class="w" inputmode="decimal" data-i18n-ph="w_ph" data-i18n-aria="w_ph"><span class="x">×</span><input class="l" inputmode="decimal" data-i18n-ph="l_ph" data-i18n-aria="l_ph"><button type="button" class="rm" data-i18n-aria="rm">✕</button>';
    rowsEl.appendChild(d);
    apply(d);
  }

  function calc(){
    var t = T[lang], items = [], area = 0;
    var rs = rowsEl.querySelectorAll(".row");
    for (var i = 0; i < rs.length; i++){
      var w = num(rs[i].querySelector(".w").value), l = num(rs[i].querySelector(".l").value);
      if (w && l){ items.push(fmtA(w) + "×" + fmtA(l) + " м"); area += w * l; }
    }
    var price = area > 15 ? 700 : 600;
    var k = Math.floor(num(document.getElementById("kurp").value));
    var b = Math.floor(num(document.getElementById("blank").value));
    var carpet = area * price;
    summary = {area: area, price: price, k: k, b: b, total: carpet + (k + b) * 2000, items: items};
    var out = document.getElementById("sum");
    if (!area && !k && !b){ out.textContent = t.empty; return; }
    out.innerHTML =
      (area ? t.s_carpets + ": <b>" + fmtA(area) + " м²</b> × " + fmt(price) + " " + t.s_tg + " = " + fmt(carpet) + " " + t.s_tg + "<br>" : "") +
      (k ? t.s_kurp + ": " + k + " " + t.s_pcs + " = " + fmt(k * 2000) + " " + t.s_tg + "<br>" : "") +
      (b ? t.s_blank + ": " + b + " " + t.s_pcs + " = " + fmt(b * 2000) + " " + t.s_tg + "<br>" : "") +
      '<span class="tot">' + t.s_total + ": " + fmt(summary.total) + " " + t.s_tg + "</span>";
  }

  function setLang(l, save){
    lang = l;
    if (save){ try { localStorage.setItem("lang", l); } catch (e) {} }
    document.documentElement.lang = l;
    document.title = T[l].title;
    document.getElementById("l-ru").setAttribute("aria-pressed", l === "ru" ? "true" : "false");
    document.getElementById("l-kk").setAttribute("aria-pressed", l === "kk" ? "true" : "false");
    apply(document);
    calc();
  }

  rowsEl.addEventListener("input", calc);
  rowsEl.addEventListener("click", function(e){
    var b = e.target.closest(".rm"); if (!b) return;
    var row = b.parentNode;
    if (rowsEl.querySelectorAll(".row").length > 1){ rowsEl.removeChild(row); }
    else { row.querySelector(".w").value = ""; row.querySelector(".l").value = ""; }
    calc();
  });
  document.getElementById("add").addEventListener("click", function(){ addRow(); });
  document.getElementById("kurp").addEventListener("input", calc);
  document.getElementById("blank").addEventListener("input", calc);
  document.getElementById("l-ru").addEventListener("click", function(){ setLang("ru", true); });
  document.getElementById("l-kk").addEventListener("click", function(){ setLang("kk", true); });

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var name = val("name"), phone = val("phone"), addr = val("addr"), note = val("note");
    var digits = phone.replace(/\D/g, "");
    var b1 = mark("g-name", name.length < 2);
    var b2 = mark("g-phone", digits.length < 10);
    var b3 = mark("g-addr", addr.length < 4);
    if (b1 || b2 || b3) return;

    var text = "Новая заявка на стирку ковров\n" +
      "Имя: " + name + "\n" +
      "Телефон: " + phone + "\n" +
      "Адрес: " + addr +
      (summary.area ? "\nКовры: " + summary.items.join(", ") + " (" + fmtA(summary.area) + " м²)" : "") +
      (summary.k ? "\nКорпешки: " + summary.k + " шт" : "") +
      (summary.b ? "\nОдеяла: " + summary.b + " шт" : "") +
      (summary.total ? "\nПримерная сумма: " + fmt(summary.total) + " тг" : "") +
      (note ? "\nКомментарий: " + note : "") +
      (lang === "kk" ? "\nКлиент пишет на казахском (қазақша)" : "");
    var url = "https://wa.me/" + WA + "?text=" + encodeURIComponent(text);

    var link = document.getElementById("wa");
    link.href = url;
    document.getElementById("done").classList.add("show");
    try { link.click(); } catch (err) {}
  });

  addRow();
  setLang(lang, false);
})();
</script>
</body>
</html>
